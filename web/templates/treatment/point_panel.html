<!-- Point info panel -->
<aside id="point-panel" class="zf-point-panel tp hidden" role="dialog" aria-modal="false" aria-labelledby="panel-code">
  <div class="zf-point-panel-content">
    <div class="tp-panel-head">
      <h3 id="panel-code" class="tp-panel-code"></h3>
      <button type="button" data-action="close-point-panel" class="tp-icon-btn" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" focusable="false"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="panel-body"></div>
  </div>
</aside>

<!-- Point info panel -->
<div id="point-panel" class="zf-point-panel hidden">
  <div class="zf-point-panel-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h3 id="panel-code" style="font-size:20px;font-weight:700;color:#0D9488;"></h3>
      <button data-action="close-point-panel" style="background:none;border:none;cursor:pointer;color:#9CA3AF;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="panel-body"></div>
  </div>
</div>

      <!-- Points Used -->
      <div class="zf-card">
        <div class="zf-card-title">
          <div class="zf-card-icon tp-icon-blue">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <span>{{ t['treatment_points_used'] if t else 'Acupuncture Points Used' }}</span>
          <span id="points-ai-badge" class="tp-pill-blue">{{ t['treatment_ai_formula'] if t else 'AI Formula' }}</span>
          <button id="regen-points-btn" class="zf-btn zf-btn-outline tp-regen-btn" data-action="regenerate-points" title="Re-run point selection (Request 2 + 3)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            {{ t['treatment_regenerate_points'] if t else 'Regenerate Points' }}
          </button>
        </div>

        <!-- Progress bar shown while AI is computing the formula -->
        <div id="points-progress" class="tp-progress">
          <div class="tp-progress-head">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" class="tp-spin-slow"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span id="points-progress-label" class="tp-progress-label">{{ t['treatment_diagnosing'] if t else 'Diagnosing…' }}</span>
            <button id="cancel-generation-btn" type="button" data-action="cancel-generation"
              class="zf-btn zf-btn-outline tp-cancel-btn" title="Stop this AI generation">
              Cancel
            </button>
          </div>
          <div class="tp-progress-track">
            <div id="points-progress-bar" class="tp-progress-bar"></div>
          </div>
        </div>

        <div class="tp-mt-14">
          <div id="suggested-points" class="tp-chips"></div>
          <div class="zf-points-input-wrap" id="points-wrap">
            <div id="points-tags" class="zf-points-tags"></div>
            <input type="text" id="point-input" class="zf-points-input" placeholder="{{ t['treatment_point_input_placeholder'] if t else 'Type point code (e.g. ST36) and press Enter…' }}" />
            <button class="zf-points-add" data-action="add-point">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
          <p class="tp-input-hint" id="point-count">0 {{ t['treatment_point_count_hint'] if t else 'points selected · Press Enter to add, Backspace to remove last' }}</p>
        </div>
      </div>

  <!-- AI Suggested Points — full-width card grid -->
  <section id="ai-points-section" class="tp-ai-section" aria-labelledby="ai-points-title">
    <div class="zf-card tp-card-flush">
      <div class="zf-card-title tp-card-title-ruled">
        <div class="zf-card-icon tp-icon-teal-gradient">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
            <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
          </svg>
        </div>
        <div>
          <h2 class="tp-section-title" id="ai-points-title">{{ t['treatment_ai_points_header'] if t else 'AI-Suggested Acupuncture Points' }}</h2>
          <span class="tp-section-count" id="ai-points-count" aria-live="polite"></span>
        </div>
        <span class="tp-pill-teal">{{ t['treatment_personalised_formula'] if t else 'Personalised Formula' }}</span>
      </div>
      <!-- A run in progress: its real stage (Phase 4.2b) -->
      <div id="ai-points-status" class="ps-status" hidden>
        <ol class="ps-steps" aria-hidden="true">
          <li data-step="summary"></li>
          <li data-step="diagnosis"></li>
          <li data-step="batch-a"></li>
          <li data-step="batch-b"></li>
        </ol>
        <p id="ai-points-step" class="ps-step-label" role="status"></p>
        <button id="cancel-generation-btn" type="button" data-action="cancel-generation"
          class="zf-btn zf-btn-outline ps-cancel" title="Stop this AI generation">Cancel</button>
      </div>
      <div id="ai-points-grid" class="tp-ai-grid"></div>
      <!-- Empty, failed, cancelled and stalled states -->
      <div id="ai-points-message" class="ps-message" hidden></div>
    </div>
  </section>

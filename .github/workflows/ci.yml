# Continuous integration (Phase 9.10): the quality gate + supply-chain scanners on every push/PR.
# Mirrors `python tasks.py all` and adds dependency + secret scanning. Bandit fails the build on
# HIGH findings only (the pre-existing LOW/MEDIUM baseline is tracked as debt T1, not a CI blocker).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: lint · type · test · bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Format check (black)
        run: black --check bot web startup zenflow tests

      - name: Lint (ruff)
        run: ruff check bot web startup zenflow tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests (not e2e)
        run: python -m pytest -m "not e2e" -q -p no:cacheprovider

      - name: Security lint (bandit — fail on HIGH)
        run: bandit -q -r bot web zenflow startup -x tests --severity-level high --confidence-level high

  supply-chain:
    name: deps · secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependency vulnerabilities (pip-audit)
        # Advisory first (like 9.4's report-only CSP): surfaces known CVEs in the pinned deps.
        # Flip `continue-on-error` to false to make it block once the baseline is triaged.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

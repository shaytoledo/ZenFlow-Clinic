# Continuous integration (Phase 9.10, extended in 11.7): the quality gate + supply-chain scanners
# on every push/PR, plus the e2e journeys and coverage upload, and (12.2.1) the container images:
# built, the web container started and its /healthz answered, non-root checked, trivy (advisory).
# And (12.2.3) the Alembic baseline built on a real Postgres 16 and exercised there, and (12.2.2)
# the whole test suite run a second time on Postgres (`postgres-suite`).
# Pipeline order: lint → type → unit+integration+security (with coverage) → e2e; supply-chain runs
# alongside. Bandit fails the build on HIGH findings only (the pre-existing LOW/MEDIUM baseline is
# tracked as debt T1, not a CI blocker).
#
# Required status checks on `master` (branch protection, set 2026-10-02): quality, e2e,
# supply-chain, container and postgres, by their job `name:`. Renaming a job's `name:` here orphans
# its required check (every PR then waits forever), so update the protection rule in the same change.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: lint · type · test · coverage · bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Format check (black)
        run: black --check bot web startup zenflow tests

      - name: Lint (ruff)
        run: ruff check bot web startup zenflow tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests with coverage (unit · integration · security · contract; not e2e)
        # --timeout turns a hung test into a fast, named failure (signal method on Linux interrupts
        # the stuck test and reports its nodeid) instead of a 6-hour job timeout.
        run: >
          python -m pytest -m "not e2e" -q -p no:cacheprovider
          --timeout=120
          --cov=bot --cov=web --cov=zenflow --cov=startup
          --cov-report=xml --cov-report=term-missing:skip-covered

      - name: Security lint (bandit — fail on HIGH)
        run: bandit -q -r bot web zenflow startup -x tests --severity-level high --confidence-level high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  e2e:
    name: e2e journeys (Playwright · Chrome)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ubuntu-latest ships Google Chrome; ensure Playwright's OS libraries are present.
      - name: Playwright system libraries
        run: python -m playwright install-deps chromium

      # The five critical journeys (J1–J5): a live in-thread server + fakeredis + the installed
      # Chrome. Platform-specific visual snapshots (tests/e2e/test_visual_snapshots.py,
      # test_followup_card.py) are intentionally excluded — their baselines are per-developer-OS.
      - name: E2E journeys
        run: >
          python -m pytest -q -p no:cacheprovider --timeout=180
          tests/e2e/test_journey_signin.py
          tests/e2e/test_journey_intake_ready.py
          tests/e2e/test_journey_schedule.py
          tests/e2e/test_journey_session_complete.py
          tests/e2e/test_journey_followup_view.py

  supply-chain:
    name: deps · secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependency vulnerabilities (pip-audit)
        # Advisory first (like 9.4's report-only CSP): surfaces known CVEs in the pinned deps.
        # Flip `continue-on-error` to false to make it block once the baseline is triaged.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: container images (build · run · scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the three service images
        run: |
          docker build --target web -t zenflow-web:ci .
          docker build --target bots -t zenflow-bots:ci .
          docker build --target worker -t zenflow-worker:ci .

      - name: The web container starts and answers /healthz
        run: |
          docker run -d --name zf-web -p 8080:8080 -e ENV=dev zenflow-web:ci
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo; docker inspect --format '{{.State.Health.Status}}' zf-web; exit 0
            fi
            sleep 2
          done
          docker logs zf-web; exit 1

      - name: Services never run as root
        run: |
          for image in zenflow-web:ci zenflow-bots:ci zenflow-worker:ci; do
            uid=$(docker run --rm --entrypoint id "$image" -u)
            echo "$image runs as uid $uid"; test "$uid" != "0"
          done

      - name: The compose stack is valid
        run: docker compose config -q

      - name: Image vulnerability scan (trivy — advisory)
        # Advisory first, like pip-audit: surfaces CVEs in the base image and wheels.
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --exit-code 1 --no-progress zenflow-web:ci

  postgres:
    name: schema on Postgres (Alembic baseline)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zenflow
          POSTGRES_USER: zenflow
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenflow -d zenflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ZF_TEST_POSTGRES_URL: postgresql+psycopg://zenflow:ci-only-password@localhost:5432/zenflow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build the schema with Alembic
        run: python -m zenflow.migrate --url "$ZF_TEST_POSTGRES_URL" upgrade

      - name: The schema works on Postgres
        run: python -m pytest tests/integration/test_schema_postgres.py -q -p no:cacheprovider

  postgres-suite:
    # 12.2.2 (ADR-46): the WHOLE suite (not e2e) on Postgres 16, beside the SQLite run in `quality`.
    # The proof that the AWS database (RDS Postgres) works: every repository, job and route runs on
    # it. Tests marked `sqlite_only` (the file, PRAGMAs, the backup API) are skipped here.
    name: test suite on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zenflow
          POSTGRES_USER: zenflow
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenflow -d zenflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ZF_TEST_DB_URL: postgresql+psycopg://zenflow:ci-only-password@localhost:5432/zenflow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests on Postgres (unit · integration · security · contract · bot; not e2e)
        run: python -m pytest -m "not e2e" -q -p no:cacheprovider --timeout=120 -rfE

  infra:
    # 12.2.6 (ADR-50): the Terraform is formatted, valid and scanned for misconfiguration.
    # No AWS credentials exist here — nothing is planned or applied from CI.
    name: terraform (fmt · validate · scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate (no backend, no credentials)
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Misconfiguration scan (trivy, HIGH/CRITICAL fail the job)
        # Each accepted exception is a `#trivy:ignore:<id>` comment next to the resource, with its
        # reason (the public ALB; HTTPS-only egress to APIs that have no fixed addresses).
        working-directory: .
        run: |
          docker run --rm -v "$PWD/infra/terraform:/src" aquasec/trivy:0.75.0 \
            config --severity HIGH,CRITICAL --exit-code 1 /src

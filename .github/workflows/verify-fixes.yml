# Fix verification (docs/FIX_VERIFICATION.md): undo every recorded fix and prove its regression test
# fails. Slow (~1,500 test runs), so it runs weekly and on demand rather than on every push.
name: Verify fixes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

permissions:
  contents: read

jobs:
  verify:
    name: every fix is caught when undone
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Undo each fix, expect its test to fail
        run: python tests/mutation/run.py

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: mutation_results.json
